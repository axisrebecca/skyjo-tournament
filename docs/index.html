<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyjo Tournament</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Skyjo Tournament</h1>
    <p id="status">Connecting…</p>

    <section id="roster">
      <h2>Players</h2>
      <form id="auth-test-form">
        <label>
          Organizer PIN
          <input
            id="organizer-pin"
            type="password"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            autocomplete="current-password"
            required
          />
        </label>
        <button type="submit">Unlock editing</button>
      </form>
      <p id="auth-status" role="status"></p>
      <button id="sign-out" type="button" hidden>Lock editing</button>

      <form id="add-player-form" hidden>
        <label>
          Player name
          <input
            id="player-name"
            type="text"
            maxlength="80"
            autocomplete="off"
            required
          />
        </label>
        <button type="submit">Add player</button>
      </form>
      <p id="roster-status" role="status"></p>
      <ul id="player-list"></ul>
    </section>

    <section id="leaderboard">
      <h2>Leaderboard</h2>
      <div class="view-controls" role="group" aria-label="Leaderboard order">
        <button
          type="button"
          data-leaderboard-view="leaders"
          aria-pressed="true"
        >
          Leaders
        </button>
        <button
          type="button"
          data-leaderboard-view="least-games"
          aria-pressed="false"
        >
          Least games
        </button>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th scope="col">Player</th>
              <th scope="col">Points</th>
              <th scope="col">Games</th>
              <th scope="col">1st</th>
              <th scope="col">2nd</th>
            </tr>
          </thead>
          <tbody id="leaderboard-list"></tbody>
        </table>
      </div>

      <h3>Game history</h3>
      <ul id="game-history"></ul>
    </section>

    <section id="new-game">
      <h2>Start new game</h2>
      <div id="unfinished-games" hidden>
        <h3>Unfinished games</h3>
        <p id="unfinished-games-status" role="status"></p>
        <ul id="unfinished-game-list"></ul>
      </div>
      <div id="new-game-controls" hidden>
        <div class="game-setup-actions">
          <p id="selection-count">0 of 8 players selected</p>
          <button id="add-all-players" type="button">Add all (up to 8)</button>
        </div>
        <p id="game-setup-status" role="status"></p>
        <ul id="game-player-list"></ul>
        <button id="generate-seating" type="button" disabled>Start game</button>
      </div>
      <p id="new-game-locked">Unlock editing to start a game.</p>

      <div id="seating" hidden>
        <h3>Table seating</h3>
        <ol id="seating-list"></ol>
        <button id="game-finished" type="button">Game finished</button>
      </div>
    </section>

    <section id="score-entry" hidden>
      <h2>Enter scores</h2>
      <form id="score-entry-form"></form>
    </section>

    <!-- Firebase (config is public by design, see firebase-setup.md) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
